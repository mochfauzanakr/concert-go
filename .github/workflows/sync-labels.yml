name: Sync Labels
on:
  push:
    branches: [ "main" ]
    paths: [ ".github/labels.yml" ]

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml