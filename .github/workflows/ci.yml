name: Backend CI Checks

on:
  push:
  pull_request:
    branches: [ "main"]

jobs:
  test-and-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Go Vet (Static Analysis / Linter)
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Test Build (Compilation Check)
        run: go build -o /dev/null ./main.go