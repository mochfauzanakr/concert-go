name: Backend CI Checks

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Go Vet (Static Analysis / Linter)
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Test Build (Compilation Check)
        run: go build -o /dev/null ./main.go